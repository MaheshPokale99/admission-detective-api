services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: detective
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d detective"]
            interval: 5s
            timeout: 3s
            retries: 10

    api:
        profiles: ["app"]
        build: ./backend
        depends_on:
            db:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PORT: 8787
            DATABASE_URL: postgresql://postgres:postgres@db:5432/detective
            FRONTEND_ORIGIN: http://localhost:3000
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
            GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
            EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
            EMAIL_FROM: ${EMAIL_FROM:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASS: ${SMTP_PASS:-}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            SEED_ON_EMPTY: "true"
            ENABLE_DEMO_ENDPOINTS: "true"
        ports:
            - "8787:8787"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/readyz >/dev/null || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 10

    web:
        profiles: ["app"]
        build:
            context: ./frontend
            args:
                NEXT_PUBLIC_API_URL: http://localhost:8787
        depends_on:
            api:
                condition: service_healthy
        ports:
            - "3000:3000"

volumes:
    pgdata:
