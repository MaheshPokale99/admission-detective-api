steps:
    - name: gcr.io/cloud-builders/docker
      args:
          - build
          - --build-arg
          - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
          - --tag
          - ${_IMAGE}
          - .
images:
    - ${_IMAGE}
substitutions:
    _IMAGE: asia-south1-docker.pkg.dev/dynarock-backend-2026/admission-detective/frontend:latest
    _NEXT_PUBLIC_API_URL: http://localhost:8787
options:
    logging: CLOUD_LOGGING_ONLY
